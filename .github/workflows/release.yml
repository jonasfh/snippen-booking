name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create tags and releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract plugin version
        id: version
        run: |
          VERSION=$(grep -i "^ \* Version:" src/wp-content/plugins/booking-plugin/booking-plugin.php | awk '{print $3}' | tr -d '\r')
          echo "### Deployment Oppsummering 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Versjon:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        if: github.event_name != 'workflow_dispatch'
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist. Proceeding with release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        if: github.event_name != 'workflow_dispatch' && steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Package Plugin
        if: github.event_name == 'workflow_dispatch' || steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Create a temporary directory for packaging
          mkdir -p build/snippen-booking
          # Copy only the necessary files
          cp -r src/wp-content/plugins/booking-plugin/* build/snippen-booking/
          # Create the zip file with version in name
          cd build
          zip -r ../snippen-booking-v$VERSION.zip snippen-booking/
          cd ..

      - name: Extract Changelog Entry
        if: github.event_name != 'workflow_dispatch' && steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          # It looks for the header for this version and takes everything until the next header (or end of file)
          sed -n "/## \[$VERSION\]/,/## /p" CHANGELOG.md | sed '1d;$d' > release_notes.md

          # Add link to full changelog
          echo -e "\n\n[Se hele CHANGELOG.md her](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> release_notes.md

          echo "#### Release Notes for $VERSION:" >> $GITHUB_STEP_SUMMARY
          cat release_notes.md >> $GITHUB_STEP_SUMMARY

          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: snippen-booking-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: false

      - name: Add Release Link to Summary
        if: github.event_name != 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          if [[ "${{ steps.check_tag.outputs.exists }}" == "true" ]]; then
            echo "- **Status:** ℹ️ Versjonen eksisterer allerede. [Se eksisterende release her]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** ✅ Ny release opprettet! [Se den her]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: snippen-booking-v${{ steps.version.outputs.version }}
          path: build/
