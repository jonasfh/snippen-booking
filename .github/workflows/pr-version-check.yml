name: PR Version Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  check-version:
    permissions:
      contents: read
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for tags and base branch diff

      - name: Check if src/ changed
        id: src_changes
        run: |
          if [ -n "$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- src/ package.json package-lock.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### PR Versjonskontroll 🔍" >> "$GITHUB_STEP_SUMMARY"
            echo "- ℹ️ Ingen endringer i \`src/\`, \`package.json\` eller \`package-lock.json\` — hopper over krav om versjonsbump og CHANGELOG." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract plugin version
        if: steps.src_changes.outputs.changed == 'true'
        id: version
        run: |
          # Extract version from booking-plugin.php
          VERSION=$(grep -i "^ \* Version:" src/wp-content/plugins/booking-plugin/booking-plugin.php | awk '{print $3}' | tr -d '\r')
          echo "### PR Versjonskontroll 🔍" >> $GITHUB_STEP_SUMMARY
          echo "- **Versjon i fil:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.src_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "- **Tag sjekk:** ❌ Tag $TAG eksisterer allerede!" >> $GITHUB_STEP_SUMMARY
            echo "::error::Tag $TAG already exists in the repository! Please bump the version in src/wp-content/plugins/booking-plugin/booking-plugin.php before merging."
            exit 1
          else
            echo "- **Tag sjekk:** ✅ Tag $TAG er ledig." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify CHANGELOG is updated
        if: steps.src_changes.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "- **CHANGELOG sjekk:** ❌ Mangler oppføring for $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "::error::CHANGELOG.md is not updated for version $VERSION! Please add an entry for this version."
            exit 1
          fi
          echo "- **CHANGELOG sjekk:** ✅ Oppdatert for $VERSION." >> $GITHUB_STEP_SUMMARY
