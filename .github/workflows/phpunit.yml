name: PHPUnit Tests

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, v2.0 ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/**'

jobs:
  phpunit:
    permissions:
      contents: read
    environment: prod
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mysqli, mbstring, xml
        tools: composer:v2, wp-cli

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        composer install --no-progress
        npm ci

    - name: Setup WordPress
      run: |
        mkdir -p /tmp/wordpress
        wp core download --version=7.0 --path=/tmp/wordpress
        wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
        wp core install --path=/tmp/wordpress --url=http://localhost --title="Test Site" --admin_user=admin --admin_password=admin --admin_email=admin@example.com

        # Link and activate the plugin so constants and hooks are registered
        ln -s $GITHUB_WORKSPACE/src/wp-content/plugins/booking-plugin /tmp/wordpress/wp-content/plugins/snippen-booking
        wp plugin activate snippen-booking --path=/tmp/wordpress

    - name: Run PHPCS lint
      run: |
        echo "### PHPCS Lint Results 🎨" >> $GITHUB_STEP_SUMMARY
        if composer lint; then
          echo "✅ Ingen PHPCS-feil eller advarsler funnet!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ PHPCS linting feilet. Rett alle kodesstilfeil og advarsler." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Run tests
      env:
        WP_ABSPATH: /tmp/wordpress/
      run: |
        echo "### PHPUnit Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        # Run PHPUnit tests
        if composer test; then
          echo "✅ Alle PHP-tester passerte!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Noen PHP-tester feilet. Se detaljer i loggen over." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Run JS tests
      run: |
        echo "### JS Test Results 🧪" >> $GITHUB_STEP_SUMMARY
        # Run Jest tests
        if npm run test:js; then
          echo "✅ Alle JS-tester passerte!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Noen JS-tester feilet. Se detaljer i loggen over." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
