name: UI & Visual Regression Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, v2.0 ]
    paths:
      - 'src/wp-content/plugins/booking-plugin/css/**'
      - 'src/wp-content/plugins/booking-plugin/js/**'
      - 'src/wp-content/plugins/booking-plugin/views/**'
      - 'src/wp-content/plugins/booking-plugin/inc/**'
      - 'tests/ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/ui-tests.yml'

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Run Playwright Visual Regression Tests
      run: npm run test:ui

    - name: Upload Test Results Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          test-results/
          playwright-report/
        retention-days: 7
