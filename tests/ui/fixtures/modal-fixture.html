<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Modal Fixture</title>
    <link rel="stylesheet" href="../../src/wp-content/plugins/booking-plugin/css/booking.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="snippen-modal-open">
    <div id="snippen-booking-modal" class="snippen-booking-modal-overlay">
        <div class="snippen-booking-modal-content">
            <div class="snippen-booking-modal-header">
                <h2 class="snippen-booking-modal-title" id="snippen-booking-modal-title">Bookingdetaljer</h2>
                <button type="button" class="snippen-booking-modal-close" aria-label="Lukk">&times;</button>
            </div>
            <div class="snippen-booking-modal-body">
                <div class="snippen-modal-details-content">
                    <div class="snippen-modal-badge-wrapper">
                        <span class="snippen-badge snippen-status-confirmed">Bekreftet</span>
                    </div>
                    <div class="snippen-booking-details-grid">
                        <div class="detail-row">
                            <span class="detail-label">Leietaker:</span>
                            <span class="detail-value">Ola Nordmann</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Telefon:</span>
                            <span class="detail-value">+47 99 88 77 66</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Lokale:</span>
                            <span class="detail-value">Storsalen og Kjøkken</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Dato:</span>
                            <span class="detail-value">Lørdag 12. september 2026</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Tidspunkt:</span>
                            <span class="detail-value">12:00 – 18:00</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Dørkode:</span>
                            <span class="detail-value snippen-door-code">1234#</span>
                        </div>
                    </div>
                    <div class="snippen-payment-status-section" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
                        <div class="detail-row">
                            <span class="detail-label">Betalingsstatus:</span>
                            <span class="detail-value"><span class="snippen-badge snippen-status-pending">Ubetalt (500 kr)</span></span>
                        </div>
                        <div style="margin-top: 12px;">
                            <button type="button" class="snippen-payment-action-btn" style="background:#ff5b24; color:#fff; border:none; padding:8px 16px; border-radius:4px; font-weight:600; cursor:pointer;">Betal med Vipps</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="snippen-booking-modal-footer">
                <button type="button" class="snippen-modal-footer-close-btn">Lukk</button>
            </div>
        </div>
    </div>
</body>
</html>
